<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ثبت سفارش</title>

    <link rel="stylesheet" href="acss/learn.css">
</head>

<body>

    <div class="order-form">

        <h2>ثبت سفارش 🛒</h2>

        <!-- سبد خرید -->
        <div class="checkout-cart">

            <h3>محصولات شما</h3>

            <ul id="checkout-cart-items"></ul>

        </div>


        <div class="form-group">

            <label>نام و نام خانوادگی</label>

            <input type="text" placeholder="نام خود را وارد کنید">

        </div>


        <div class="form-group">

            <label>شماره تلفن</label>
              <input
                    type="tel"
                  placeholder="مثلاً 09123456789"
                 maxlength="11"
                >

        </div>


        <div class="form-group">

            <label>آدرس</label>

            <textarea placeholder="آدرس کامل خود را وارد کنید"></textarea>

        </div>


        <div class="form-group">

            <label>روش پرداخت</label>
             <select>

                 <option value="" disabled selected>انتخاب روش پرداخت</option>

                 <option value="online">پرداخت آنلاین</option>

                 <option value="cash">پرداخت در محل</option>
                

             </select>
        </div>


        <div class="order-summary">

            <span>مبلغ نهایی:</span>

            <strong id="order-total-price">0 تومان</strong>

        </div>


        <button class="submit-order">
            ثبت سفارش
        </button>

    </div>

    <div class="success-modal">
    <div class="success-box">
        <div class="success-icon">✓</div>
        <h2>سفارش با موفقیت ثبت شد!</h2>
        <p>سفارش شما با موفقیت ثبت شد.</p>
        <button class="success-close">باشه</button>
    </div>
    </div>

    <script src="learn.js"></script>

</body>

</html>
